name: Build CLI Workspace CI/CD

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
  # Run CI on a branch by hand, e.g. when GitHub dropped a push event
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust and wasm-pack
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target wasm32-unknown-unknown
          source "$HOME/.cargo/env"
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # A change that bumps the version must bring its CHANGELOG.md section (it becomes the GitHub release)
      - name: Release notes in CHANGELOG.md
        run: |
          BASE=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          OLD=$(git show "$BASE:packages/cli/package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          NEW=$(node -p "require('./packages/cli/package.json').version")
          if [ "$OLD" != "$NEW" ]; then node tools/release-notes.js --check; else echo "Version unchanged ($NEW)."; fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint affected projects
        run: pnpm exec nx affected -t lint --base=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}

      - name: Build affected projects
        run: pnpm exec nx affected -t build --base=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}

      - name: Run tests
        run: pnpm exec nx affected -t test --base=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }} -- --browsers=ChromeHeadless --no-watch
