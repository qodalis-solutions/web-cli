<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PM9FJFSCVV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PM9FJFSCVV');
    </script>

    <meta charset="utf-8" />
    <title>Qodalis CLI — Web Terminal Framework for Angular, React & Vue</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A lightweight, extensible web terminal for Angular, React, and Vue. Tabs, split panes, plugin ecosystem, and full theming."
    />
    <link rel="icon" type="image/svg+xml" href="assets/qodalis-icon.svg" />
    <!-- Light/dark before first paint: the reader's choice (ThemeService, same
         storage key), else the system setting -->
    <script>
      (function () {
        var mode = 'system';
        try { mode = localStorage.getItem('qcli-docs-theme') || 'system'; } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', mode);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <!-- Critical inline styles to prevent FOUC (a flash of the wrong colours before the stylesheet loads) -->
    <style>
      :root { --loader-bg: #070b14; --loader-fg: rgba(255, 255, 255, 0.87); --loader-muted: rgba(255, 255, 255, 0.6); --loader-card: #0d1117; --loader-bar: #111827; --loader-border: #1e293b; --loader-accent: #818cf8; }
      :root[data-theme="light"] { --loader-bg: #ffffff; --loader-fg: #1e293b; --loader-muted: #475569; --loader-card: #f6f8fb; --loader-bar: #eef2f7; --loader-border: #e2e8f0; --loader-accent: #4f46e5; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--loader-bg);
        color: var(--loader-fg);
      }
    </style>
    <!-- Preconnect + load Google Fonts with optional display to prevent font swap glitch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=optional"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root>
      <!-- Loader: removed automatically when Angular bootstraps -->
      <style>
        .app-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: var(--loader-bg);
          z-index: 9999;
          gap: 28px;
        }
        .app-loader-terminal {
          width: 280px;
          background: var(--loader-card);
          border: 1px solid var(--loader-border);
          border-radius: 10px;
          overflow: hidden;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }
        .app-loader-titlebar {
          display: flex;
          align-items: center;
          gap: 6px;
          padding: 10px 14px;
          background: var(--loader-bar);
          border-bottom: 1px solid var(--loader-border);
        }
        .app-loader-dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
        }
        .app-loader-dot:nth-child(1) { background: #ef4444; }
        .app-loader-dot:nth-child(2) { background: #eab308; }
        .app-loader-dot:nth-child(3) { background: #22c55e; }
        .app-loader-body {
          padding: 16px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 13px;
          line-height: 1.7;
          color: var(--loader-fg);
        }
        .app-loader-prompt {
          color: var(--loader-accent);
        }
        .app-loader-cursor {
          display: inline-block;
          width: 8px;
          height: 15px;
          background: var(--loader-accent);
          vertical-align: text-bottom;
          margin-left: 2px;
          animation: blink 1s step-end infinite;
        }
        @keyframes blink {
          50% { opacity: 0; }
        }
        .app-loader-text {
          margin-top: 0;
          font-family: 'Inter', sans-serif;
          font-size: 13px;
          color: var(--loader-muted);
          letter-spacing: 0.5px;
        }
      </style>
      <div class="app-loader">
        <div class="app-loader-terminal">
          <div class="app-loader-titlebar">
            <div class="app-loader-dot"></div>
            <div class="app-loader-dot"></div>
            <div class="app-loader-dot"></div>
          </div>
          <div class="app-loader-body">
            <div><span class="app-loader-prompt">$</span> loading qodalis-cli<span class="app-loader-cursor"></span></div>
          </div>
        </div>
        <p class="app-loader-text">Initializing terminal&hellip;</p>
      </div>
    </app-root>
  </body>
</html>
