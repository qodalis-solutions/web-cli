packages:
  - packages/*
  - packages/plugins/*
  - apps/*

shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true

allowBuilds:
  '@parcel/watcher': true
  electron: true
  esbuild: true
  less: true
  nice-napi: true
  lmdb: false
  msgpackr-extract: false
  nx: false

overrides:
  'tar': '>=7.0.0'
  'minimatch@>=10.0.0': '>=10.2.3'
  'flatted': '>=3.4.0'
  'immutable': '>=5.1.5'
  'serialize-javascript': '>=7.0.5'
  '@babel/runtime': '>=7.26.10'
  'node-forge': '>=1.4.0'
  'picomatch@>=4.0.0': '>=4.0.4'
  'path-to-regexp@<1.0.0': '^0.1.13'
  # Security patches for versions pinned by the Angular 19 tool chain (same major only).
  'piscina@>=4.0.0 <5.0.0': '^4.9.4'
  'http-proxy-middleware@>=3.0.0 <4.0.0': '^3.0.7'
  'postcss@>=8.0.0 <9.0.0': '^8.5.23'
  'undici@>=7.0.0 <8.0.0': '^7.29.1'
  '@angular/build>vite': '^6.4.3'
  'webpack-dev-middleware@>=7.0.0 <8.0.0': '^7.4.6'
  'webpack-dev-server@>=5.0.0 <6.0.0': '^5.2.6'
  '@babel/core@>=7.0.0 <8.0.0': '^7.29.6'
  '@angular/build>esbuild': '^0.28.1'
  '@angular-devkit/build-angular>esbuild': '^0.28.1'
  # tsup 8 pins esbuild 0.27, which has no patched release; tsup 9 uses 0.28.
  'tsup>esbuild': '^0.28.2'
