packages:
  - packages/*
  - packages/plugins/*
  - apps/*

shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true

allowBuilds:
  '@parcel/watcher': true
  electron: true
  esbuild: true
  less: true
  nice-napi: true
  lmdb: false
  msgpackr-extract: false
  nx: false

overrides:
  'tar': '>=7.0.0'
  'minimatch@>=10.0.0': '>=10.2.3'
  'flatted': '>=3.4.0'
  'immutable': '>=5.1.5'
  'serialize-javascript': '>=7.0.5'
  '@babel/runtime': '>=7.26.10'
  'node-forge': '>=1.4.0'
  'picomatch@>=4.0.0': '>=4.0.4'
  'path-to-regexp@<1.0.0': '^0.1.13'
  # tsup 8 pins esbuild 0.27, which has no patched release; tsup 9 uses 0.28.
  'tsup>esbuild': '^0.28.2'
  # nx 23.3 pins undici 7.29.0; sockjs (webpack-dev-server) still asks for uuid 8. Both are patched in-range.
  'nx>undici': '^7.29.1'
  'sockjs>uuid': '^11.1.1'
